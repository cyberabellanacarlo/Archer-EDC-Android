<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f8fc"><title>Archer EDC</title><style>
:root{font-family:Inter,system-ui,-apple-system,Arial,sans-serif;color:#eaf2fa;background:#0a1320}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}.shell{max-width:650px;margin:auto;min-height:100dvh;padding:24px 18px 100px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.brand{font-weight:850;letter-spacing:.15em;font-size:18px}.sub{font-size:12px;color:#91a5bb;letter-spacing:.13em}.pill{background:#192d40;color:#b9d6f2;border:1px solid #30495e;border-radius:100px;padding:9px 13px;font-size:12px}.hero{background:linear-gradient(130deg,#183b53,#172639);border:1px solid #33526b;padding:22px;border-radius:22px;margin-bottom:20px}.eyebrow{color:#7bd6e5;font-size:12px;font-weight:750;letter-spacing:.12em}.hero h1{font-size:30px;margin:8px 0 9px;line-height:1.15}.muted{color:#a3b6c9;line-height:1.55;font-size:14px}.call{display:inline-flex;align-items:center;justify-content:center;background:#dc4757;color:white;border:0;border-radius:13px;padding:13px 18px;font-weight:750;text-decoration:none}.section{font-weight:750;font-size:18px;margin:22px 0 13px}.search{width:100%;background:#172536;border:1px solid #31475e;border-radius:14px;color:white;padding:15px;outline:none}.search:focus{border-color:#70c8e5}.chips{display:flex;gap:8px;overflow:auto;padding:15px 0;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid #355067;border-radius:30px;background:#172536;color:#bbd0e3;padding:10px 13px;font-size:12px}.chip.active{background:#c5ebf6;color:#102337;border-color:#c5ebf6;font-weight:800}.item{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid #263d53;background:#122133;color:#eaf2fa;border-radius:15px;padding:16px;margin:9px 0}.item strong{display:block;font-size:15px}.item small{display:block;color:#94aabf;margin-top:6px;font-size:12px}.arrow{color:#83c9de;font-size:23px}.notice{border-left:3px solid #e6b46d;background:#2d2b2b;padding:12px 14px;border-radius:9px;color:#f5dbb8;font-size:12px;line-height:1.55;margin:16px 0}.back{border:0;background:transparent;color:#9fdbed;padding:12px 0;font-weight:700}.detail h1{font-size:28px;margin:12px 0}.detail h2{font-size:16px;margin:24px 0 10px}.detail li{padding:7px 0;line-height:1.55;color:#c9d7e5}.footer{position:fixed;bottom:0;left:0;right:0;background:#0e1b2a;border-top:1px solid #2a3e51;display:flex;justify-content:center;gap:6px;padding:10px 12px max(12px,env(safe-area-inset-bottom))}.footer button{flex:1;max-width:190px;background:transparent;border:0;color:#9ab1c6;padding:9px 5px;font-size:12px}.footer button.selected{color:#83e0ed;font-weight:800}.stat{font-size:12px;color:#91a5bb;margin:8px 0}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.secondary{border:1px solid #426078;background:#1c3248;color:#d6eaf7;border-radius:12px;padding:12px 14px}.empty{padding:28px;text-align:center;color:#9cb0c3}.hidden{display:none}

/* Accessible high-contrast daylight and low-glare night modes */
:root{font-family:Roboto,"Noto Sans",system-ui,Arial,sans-serif;font-size:16px;color-scheme:light;--bg:#f4f8fc;--surface:#fff;--ink:#10253c;--secondary:#38536d;--line:#a7b8c8;--accent:#005e9a;--accent-ink:#fff;--alert:#b42335;--notice-bg:#fff5df;--notice-ink:#573b0a;--hero:#e4f1fc}
:root[data-theme="dark"]{color-scheme:dark;--bg:#07121f;--surface:#13253a;--ink:#f5faff;--secondary:#c6d9e9;--line:#59748c;--accent:#8edaff;--accent-ink:#082338;--alert:#f25c69;--notice-bg:#342a1b;--notice-ink:#ffdf9c;--hero:#1b354d}
body{background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55}
.shell{padding:20px 16px 112px}.top{gap:12px;align-items:flex-start}.brand{font-size:21px;color:var(--ink);letter-spacing:.08em}.sub{color:var(--secondary);font-size:12px;font-weight:700;letter-spacing:.06em}.pill{background:var(--surface);border:1px solid var(--line);color:var(--ink);font-size:12px;font-weight:700}
.hero{background:var(--hero);border:2px solid var(--line)}.hero h1{font-size:clamp(28px,7vw,36px);line-height:1.2;color:var(--ink)}.eyebrow{color:var(--accent);font-size:14px;font-weight:800}.muted,.stat{color:var(--secondary);font-size:15px}.section{font-size:21px}.search{background:var(--surface);color:var(--ink);border:2px solid var(--line);font-size:17px;min-height:56px}.search::placeholder{color:var(--secondary)}.search:focus{border-color:var(--accent);outline:3px solid var(--line)}
.chip{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);font-size:14px;font-weight:700;min-height:48px}.chip.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.item{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);min-height:76px;padding:16px}.item strong{font-size:17px;line-height:1.4}.item small{color:var(--secondary);font-size:14px;line-height:1.4}.arrow{color:var(--accent);font-weight:800}.notice{background:var(--notice-bg);color:var(--notice-ink);border-left:5px solid #d28b13;font-size:14px}.detail h1{font-size:30px}.detail h2{font-size:20px}.detail li{font-size:17px;color:var(--ink);line-height:1.6;padding:10px 0}.back{color:var(--accent);font-size:16px;min-height:48px}.footer{background:var(--surface);border-top:2px solid var(--line)}.footer button{color:var(--secondary);font-size:15px;font-weight:700;min-height:54px}.footer button.selected{color:var(--accent);font-weight:900;border-top:3px solid var(--accent)}.secondary{background:var(--surface);color:var(--ink);border:2px solid var(--line);font-size:16px;font-weight:750;min-height:50px}.call{background:#b42335;color:white;font-size:16px;min-height:50px}.theme-btn{background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px 13px;font-weight:800;min-height:48px;white-space:nowrap}button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button{touch-action:manipulation}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main class="shell" id="app"></main><nav class="footer"><button id="homeTab">⌂ Home</button><button id="aidTab">✚ First Aid</button><button id="savedTab">☆ Saved</button></nav><script src="content-data.js"></script><script src="app.js"></script></body></html>
